# Configure pnpm settings for the workspace

# Enforce the package.json "engines" field on install (moved from .npmrc,
# since pnpm 11 only reads auth/registry settings from .npmrc).
engineStrict: true

allowBuilds:
  esbuild: false
  sharp: false # Prebuilt binaries are used; the build scripts have never run here
  workerd: false

# Delay installing published versions to reduce security risk.
minimumReleaseAge: 4320 # Three-day buffer for security updates.
