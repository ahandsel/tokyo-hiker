# .github/workflows/pr-linter.yml
# Format code and lint markdown files in pull requests

name: PR lint and format

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: read-all # Default to minimal read-only permissions for all jobs

# Prevents concurrent lint runs for the same PR to avoid conflicts and wasted resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-format:
    name: Run md-lint and code-format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Allows reading repo files
    if: ${{ github.event.pull_request.draft == false }}

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1, pinned

      # Step 2: Detect pnpm version from package.json
      - name: Detect pnpm version
        id: pnpm-version
        run: |
          version="$(jq -r '.packageManager' package.json | cut -d'@' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Step 3: Install pnpm package manager (use detected version)
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6.0.10, pinned
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # Step 4: Setup Node.js (required by pnpm and VitePress)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0, pinned
        with:
          node-version-file: .node-version # Single source of truth, keeps CI on the same Node.js as local
          cache: pnpm

      # Step 5: Install project dependencies exactly as locked, for reproducible runs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 6: Run Markdown linter in check-only mode, so problems fail the job
      - name: Run md-lint
        run: pnpm md-lint:check

      # Step 7: Run code formatter in check-only mode, so problems fail the job
      - name: Run code-format
        run: pnpm code-format:check
