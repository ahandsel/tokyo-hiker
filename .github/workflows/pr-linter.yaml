# .github/workflows/pr-linter.yaml
# Apply the repo lint fixes and run the tests in pull requests.
# This job fixes rather than gates: `pnpm lint` runs Prettier first and
# markdownlint-cli2 second, and the result is committed back to the PR branch.

name: PR lint and format

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Needs write access because the job commits the lint fixes back to the PR branch.
permissions:
  contents: write

# Prevents concurrent lint runs for the same PR to avoid conflicts and wasted resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint-and-format:
    name: Apply lint fixes and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # Allows pushing the lint fixes back to the PR branch
    if: ${{ github.event.pull_request.draft == false }}

    steps:
      # Step 1: Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1, pinned
        with:
          # The default pull-request checkout is a detached merge commit that cannot
          # be pushed, so check out the PR branch itself.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # Step 2: Detect pnpm version from package.json
      - name: Detect pnpm version
        id: pnpm-version
        run: |
          version="$(jq -r '.packageManager' package.json | cut -d'@' -f2)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Step 3: Install pnpm package manager (use detected version)
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # pnpm/action-setup@v6.0.10, pinned
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      # Step 4: Setup Node.js (required by pnpm and VitePress)
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0, pinned
        with:
          node-version-file: .node-version # Single source of truth, keeps CI on the same Node.js as local
          cache: pnpm

      # Step 5: Install project dependencies exactly as locked, for reproducible runs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 6: Apply the two-stage lint pipeline: Prettier writes, markdownlint polishes
      - name: Apply lint fixes
        run: pnpm lint

      # Step 7: Commit the result back to the PR branch.
      # `git add -u` stages tracked files only, so nothing a tool dropped is swept in.
      # Pushes made with GITHUB_TOKEN do not trigger a new workflow run, so this cannot loop.
      # The push has no write access on a fork, so the step is skipped for fork pull requests.
      - name: Commit lint fixes
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --staged --quiet || git commit -m '🎨 Apply lint fixes'
          git push

      # Step 8: Run the repo tests, including the vendored Mermaid CSS drift guard
      - name: Run tests
        run: pnpm test
